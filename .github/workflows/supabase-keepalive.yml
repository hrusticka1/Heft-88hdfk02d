name: Supabase Keep-Alive

on:
  schedule:
    - cron: "0 9 */5 * *"   # every 5 days at 9am UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sf "${{ vars.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            && echo "Supabase is alive" || echo "Ping failed"
